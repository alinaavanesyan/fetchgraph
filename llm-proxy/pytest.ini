[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
addopts = -q

# Нужно, чтобы `import llm...` работал при src-layout (src/llm/...)
# Работает через плагин pytest-pythonpath:
pythonpath =
    src

# Если у тебя есть async-тесты
asyncio_mode = auto

# Удобно, чтобы не ловить случайные предупреждения от зависимостей
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
