[project]
name = "llm-proxy"
version = "1.1.0"
requires-python = ">=3.12"
description = "Docker-first LLM proxy service"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# если у тебя много длинных строк (логгинг/тесты), можно включить:
# ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"